id: house.init-reve
suite: house
mode: offline
runner: files
description: revebot init writes the Reve bot (Chief of Staff) and gitignores sessions.
graders:
  - kind: file_exists
    path: config.yml
  - kind: file_exists
    path: workspace/agents/reve/SOUL.md
  - kind: file_exists
    path: workspace/agents/reve/profile.json
  - kind: file_contains
    path: workspace/agents/reve/SOUL.md
    text: "# Reve"
  - kind: file_contains
    path: workspace/agents/reve/SOUL.md
    text: Chief of Staff
  - kind: file_contains
    path: workspace/agents/reve/SOUL.md
    text: grand coordinator
  - kind: file_contains
    path: workspace/agents/reve/SOUL.md
    text: do not ask what to be called
  - kind: json_pointer
    path: workspace/agents/reve/profile.json
    pointer: /id
    equals: reve
  - kind: json_pointer
    path: workspace/agents/reve/profile.json
    pointer: /name
    equals: Reve
  - kind: json_pointer
    path: workspace/agents/reve/profile.json
    pointer: /title
    equals: Chief of Staff
  - kind: file_contains
    path: .gitignore
    text: workspace/agents/*/sessions/
  - kind: file_not_exists
    path: workspace/SOUL.md
  - kind: file_exists
    path: workspace/agents/reve/routines/example.lua
  - kind: file_exists
    path: workspace/plugins/web_fetch.lua
  - kind: file_exists
    path: workspace/skills/create-skill/SKILL.md
  - kind: file_exists
    path: workspace/skills/vm/SKILL.md
  - kind: file_exists
    path: workspace/skills/routines/SKILL.md
  - kind: file_exists
    path: workspace/skills/plugins/SKILL.md
  - kind: file_exists
    path: workspace/skills/secrets/SKILL.md
  - kind: file_exists
    path: workspace/skills/curator/SKILL.md
  - kind: file_exists
    path: workspace/skills/learn/SKILL.md
  - kind: file_contains
    path: workspace/skills/secrets/SKILL.md
    text: AskUserForSecret
  - kind: file_contains
    path: workspace/agents/reve/profile.json
    text: orange:goutte
