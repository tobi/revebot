name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
      - name: Install native build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libcap-ng-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Keep the gate definition in Makefile, shared with local development.
      - name: Strict checks
        run: make ci
