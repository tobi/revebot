name: Bug report
description: Report a reproducible revebot problem
title: ""
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security issues must be reported privately as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: revebot version
      placeholder: revebot 0.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Remove credentials, transcripts, and private workspace data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
