[package]
name = "revebot"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "A local house of durable bots: Rust core, Lua scripting, mandatory microVM sandbox"
license = "MIT"
repository = "https://github.com/tobi/reve"
default-run = "revebot"

[[bin]]
name = "revebot"
path = "src/main.rs"

[lib]
name = "reve"
path = "src/lib.rs"

# Shared by this package's library, binaries, integration tests and examples.
# `make clippy` turns warnings from this table into errors for every target.
[lints.rust]
unsafe_code = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Recoverable production failures must be Results, not panic paths.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
unchecked_time_subtraction = "warn"

# No debugging placeholders in shipping code.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Unsafe blocks need a reviewed justification and one operation each.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"

# A synchronous lock/refcell borrow must not span an await.
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"

# Documentation/naming style exclusions, matching the strict reference policy.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"

[dependencies]
# The sandbox. Pinned exactly: reve is written against this API and a silent
# minor bump would rebind us to something we never read.
microsandbox = "=0.6.8"
microsandbox-network = "=0.6.8"

# Scripting. Lua is vendored so an agent directory needs no system Lua.
mlua = { version = "0.11", features = ["lua54", "vendored", "send", "serialize", "async"] }

tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "signal"] }
futures = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"

reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "webpki-roots", "http2", "charset"] }

crossterm = "0.29"

anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
rand = "0.10"
sha2 = "0.11"
unicode-width = "0.2"
shell-words = "1"
glob = "0.3"
regex = "1"
parking_lot = "0.12.5"
rustix = { version = "1", features = ["fs"] }
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "multipart"] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", features = ["cors"] }

tempfile = "3"

[dev-dependencies]
microsandbox = "=0.6.8"

[profile.release]
opt-level = 2
