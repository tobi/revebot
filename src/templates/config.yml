# House configuration. Bot identity lives under
# workspace/agents/<id>/ — not at the house root.
#
# models.yml stays the provider catalog. This file is the runtime: default
# model, sandbox, secrets.

model: openrouter/x-ai/grok-4.6
thinking: low

sandbox:
  image: ghcr.io/tobi/wrap:desktop
  cpus: 2
  memory: 8192
  root_disk: 16384
  # Egress is denied by default. Hosts a secret is scoped to are reachable;
  # add more here, or let the bot ask with AskUserSandboxPolicyChange
  # (its answer is written back to this list). `open: true` opens the internet.
  allow: []
  secrets:
    - env: GITHUB_TOKEN
      source: "$(gh auth token)"
      placeholder: reve-github-token
      hosts:
        github.com:
          allow: true
        api.github.com:
          allow: true
    - env: OPENROUTER_API_KEY
      source: OPENROUTER_API_KEY
      placeholder: reve-openrouter-key
      hosts:
        openrouter.ai:
          allow: true
